name: CI

# Foundation release guard: every PR into master (and pushes to master) must
# pass a minimal set of safety checks before merge — the Unity presentation
# contract tests, the web TypeScript check, the web production build, and the
# realtime-server TypeScript/build check.
#
# Intentionally minimal: lint is NOT a required blocker in this phase (there is
# pre-existing lint debt that must not block foundation lock). No secrets are
# required — the web build does not depend on Supabase credentials at build
# time (dynamic routes fall back to empty config), so CI runs on public config.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    # Build-time-only PLACEHOLDER public config. The leaderboard is an async
    # Server Component that constructs a Supabase client during Next.js
    # build-time page-data collection; @supabase/supabase-js throws
    # "supabaseUrl is required." if NEXT_PUBLIC_SUPABASE_URL is absent. These
    # are non-secret, obviously-fake placeholders that only let the build
    # compile — CI never connects to Supabase, and real values live in Vercel.
    # NOT secrets: no service-role key, no admin emails, no private tokens,
    # and economy stays off (no economy flags set here).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unity presentation contract tests
        run: npm run test:unity-presentation

      - name: B6D3B streaming harness tests
        run: >-
          npx tsx --test
          src/lib/unity-stream-proof/manifest.test.ts
          src/lib/unity-stream-proof/security.test.ts
          src/lib/unity-stream-proof/streamProxy.test.ts
          'src/app/api/dev/unity-stream-proof/[transport]/[...path]/route.test.ts'

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Production build
        run: npm run build

  realtime-server:
    name: Realtime server — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/realtime-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/realtime-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build (tsc)
        run: npm run build
